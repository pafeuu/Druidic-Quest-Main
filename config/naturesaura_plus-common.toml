#Maximum number of logs/stems the Tree Ritual will map. (Default: 500)
#Range: 10 ~ 10000
maxRitualLogs = 500
#Maximum number of leaves the Tree Ritual will search for to destroy. (Default: 1,500)
#Range: 10 ~ 15000
maxRitualLeaves = 2500
#The aura cost of using the loot finder item. (Default: 100,000)
#Range: 0 ~ 1200000
lootFinderAuraCost = 100000
#Maximum range (in blocks) upto which loot finder item can detect treasure. (Default: 64)
#Range: 0 ~ 1024
lootFinderRange = 64
#Cooldown set on loot finder item upon use, in ticks. (Default: 1,200)
#Range: 0 ~ 72000
lootFinderUseCooldownInTicks = 200
#Horizontal range in blocks of the flower generator. (Default: 3) 
#(Note, does not affect vertical range)
#Range: 1 ~ 10
flowerGenRange = 3
#Number of flowers the flower aura generator block remembers when calculating aura generated amount. (Default: 3)
#Range: 1 ~ 1000
flowerGenMemorySize = 3
#Defines the lowest value of vitality upto which the flower generator generates aura. (Default: 0)
#Range: 0 ~ 100
flowerGenVitalityFloor = 100
#The value of the power factor in the aura generation formula for flower generator. Check wiki for more info. (Default: 0.5)
#Range: -5.0 ~ 10.0
flowerGenPowFactor = 0.5
#Horizontal range in blocks of the moss generator. (Default: 2) 
#(Note, does not affect vertical range)
#Range: 1 ~ 10
mossGenRange = 2
#Number of mosses the moss aura generator block remembers when determining if moss block is recent (Hence skipping if recent). (Default: 3)
#Range: 1 ~ 1000
mossGenMemorySize = 3
#How long the loot finder particles stay, in ticks. (Default: 1,200)
#Range: 0 ~ 72000
lootFinderLightLifeInTicks = 1200
#Cubical size radius (half-length) for range of the animal generator in blocks. (Default: 5)
#Range: 1 ~ 10
animalGenRange = 5
#Cubical size radius (half-length) for range of the slime generator in blocks. (Default: 8)
#Range: 1 ~ 32
slimeGenRange = 8
#Cubical size radius (half-length) for range of the chorus generator to check for valid plants in blocks. (Default: 2)
#Range: 1 ~ 10
chorusGenRange = 2

